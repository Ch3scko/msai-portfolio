<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of detector layers around a muon collider beam, with short soft tracks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f17"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#c9a46a" stroke-opacity="0.35" stroke-width="2">
    <circle cx="400" cy="250" r="60"/>
    <circle cx="400" cy="250" r="110"/>
    <circle cx="400" cy="250" r="160"/>
    <circle cx="400" cy="250" r="210"/>
  </g>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#7fb3c8" stroke-opacity="0.5" stroke-width="2"/>
  <g fill="none" stroke-linecap="round">
    <path d="M400 250 L560 120" stroke="#7fb3c8" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M400 250 L250 395" stroke="#7fb3c8" stroke-opacity="0.8" stroke-width="3"/>
    <path d="M400 250 C430 220 470 215 480 245" stroke="#f0c987" stroke-width="5"/>
    <path d="M400 250 C380 290 345 300 335 270" stroke="#f0c987" stroke-width="5"/>
  </g>
  <circle cx="400" cy="250" r="7" fill="#f0c987"/>
  <text x="48" y="510" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e9dcc6">Soft tracks at a 3 TeV muon collider</text>
  <text x="48" y="552" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="2" fill="#c9a46a">PHYS. REV. LETT. 134, 181802 (2025)</text>
</svg>
